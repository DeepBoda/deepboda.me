# Netlify config for deepboda.in
#
# The site is a static export. Everything it loads is self hosted, the only
# external references are outbound links, so the CSP can be strict.

[build]
  command = "npm run build"
  publish = "out"

# ===========================================================================
# Everything BELOW this line is copied into out/ by scripts/finish-export.mjs,
# so a drag-and-drop deploy keeps the headers and redirects. The [build] block
# above must NOT go with it: out/ has no package.json, so Netlify would try to
# build an already-built folder and fail with ENOENT.
# ===========================================================================

# ---------------------------------------------------------------------------
# Redirects
# ---------------------------------------------------------------------------

# The netlify.app address serves the same pages as the custom domain, which is
# duplicate content and splits any ranking signal between two hostnames. Send
# it to the real domain permanently.
[[redirects]]
  from = "https://deepboda.netlify.app/*"
  to = "https://deepboda.in/:splat"
  status = 301
  force = true

# ---------------------------------------------------------------------------
# Headers
# ---------------------------------------------------------------------------

[[headers]]
  for = "/*"
  [headers.values]
    # one year, and ask to be added to the browser preload list
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    # 'unsafe-inline' on style is required: Next inlines critical CSS and the
    # components set CSS custom properties through the style attribute.
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests"

# Hashed build assets never change under the same name, so cache them hard.
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.woff2"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The CV is replaced in place, so it must not be cached for a year.
[[headers]]
  for = "/Deep-Boda-DevOps-Engineer-CV.pdf"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"
